name = "inbox-dog-oauth"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[vars]
ENVIRONMENT = "development"

# KV namespace for storing OAuth state, tokens, etc.
[[kv_namespaces]]
binding = "KV"
id = "placeholder-will-create"

# Secrets (set via wrangler secret put):
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - JWT_SECRET
