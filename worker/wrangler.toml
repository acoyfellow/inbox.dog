name = "inbox-dog-oauth"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[vars]
ENVIRONMENT = "development"

# KV namespace for storing OAuth state, tokens, etc.
[[kv_namespaces]]
binding = "KV"
id = "736caa214df54d34b05585940aff18c8"

[env.production]
route = { pattern = "test.inbox.dog/*", zone_name = "inbox.dog" }
vars = { ENVIRONMENT = "production" }

[[env.production.kv_namespaces]]
binding = "KV"
id = "736caa214df54d34b05585940aff18c8"

# Secrets (set via wrangler secret put):
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - JWT_SECRET
